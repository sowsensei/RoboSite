<!DOCTYPE html>
<html lang="ru">
<head>

<body>
<div id="site-header"></div>

<!-- ─── Page Header ────────────────────────────────────── -->

      <div class="col-6 col-md-4 col-lg-3">

<!-- ─── Модальное окно для просмотра фото ──────────────── -->
<div class="modal fade" id="photoModal" tabindex="-1" aria-label="Просмотр фото">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content bg-dark border-0">
      <div class="modal-header border-0 pb-0">
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body text-center p-2 pt-0">
        <img id="modal-photo" src="" alt="" class="img-fluid rounded" style="max-height:80vh;object-fit:contain;">
        <div id="modal-caption" class="text-white-50 mt-2 small"></div>
      </div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script>
  function openPhoto(src, caption) {
    document.getElementById('modal-photo').src = src;
    document.getElementById('modal-caption').textContent = caption;
    new bootstrap.Modal(document.getElementById('photoModal')).show();
  }
</script>
